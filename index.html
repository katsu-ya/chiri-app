<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にっぽん ちり クイズ</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --text: #333;
    --main: #ff922b;
    --ok: #2fb344;
    --ng: #f03e3e;
    --sea: #d3ecfb;
    --land: #f4f9e9;
    --border: #8aa77a;
    --glow: #ffd43b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    font-size: 18px;
    -webkit-tap-highlight-color: transparent;
  }
  rt { font-size: .5em; font-weight: normal; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 12px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 30px;
    margin: 8px 0 12px;
    color: var(--main);
  }
  h2 { font-size: 20px; margin: 14px 0 8px; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  .grid { display: grid; gap: 10px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }

  button {
    font-family: inherit;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform .08s, box-shadow .08s, opacity .2s, background .2s;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  button:disabled { opacity: .4; cursor: default; }

  /* はじめ がめん */
  .choice {
    font-size: 17px;
    line-height: 1.5;
    padding: 8px 4px;
    opacity: .45;
  }
  .choice .mark { display: block; font-size: 28px; line-height: 1.2; }
  .choice.selected { opacity: 1; outline: 5px solid #333; outline-offset: -5px; }
  #genreChoices .choice:nth-child(1) { background: #ff7b7b; }
  #genreChoices .choice:nth-child(2) { background: #4dabf7; }
  #genreChoices .choice:nth-child(3) { background: #9775fa; }
  #genreChoices .choice:nth-child(4) { background: #51cf66; }
  #genreChoices .choice:nth-child(5) { background: #f783ac; }
  #genreChoices .choice:nth-child(6) { background: #fcc419; color: #5c3d00; }
  #areaChoices .choice { background: #20c997; padding: 9px 4px 6px; }
  #areaChoices .choice:first-child { grid-column: span 2; background: #ff922b; }

  .big-btn {
    width: 100%;
    font-size: 28px;
    padding: 14px;
    margin-top: 20px;
    background: var(--main);
  }
  .sub-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .sub-btn { font-size: 17px; line-height: 1.5; padding: 8px 6px; background: #74c0fc; }
  .sub-btn.review { background: #ff8787; }
  .sub-btn small { display: block; font-size: 13px; }
  .credit { margin-top: 14px; font-size: 12px; color: #999; text-align: center; }

  /* もんだい がめん */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
  }
  .progress {
    height: 12px;
    background: #ffe3bf;
    border-radius: 6px;
    overflow: hidden;
    margin: 6px 0 8px;
  }
  .progress > div { height: 100%; width: 0; background: var(--main); transition: width .3s; }
  .quit {
    background: none;
    color: #888;
    box-shadow: none;
    font-size: 16px;
    padding: 4px 8px;
    text-decoration: underline;
  }
  .quit:active { transform: none; box-shadow: none; }

  .quiz-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .panel { display: contents; }
  .quiz-layout .qcard { order: 1; }
  .quiz-layout .map-box { order: 2; }
  .quiz-layout .choices { order: 3; }
  .quiz-layout .feedback { order: 4; }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 8px 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .qcard { text-align: center; }
  .qtag { display: inline-block; font-size: 14px; font-weight: bold; color: #fff; background: #adb5bd; border-radius: 10px; padding: 1px 10px; line-height: 1.9; }
  .question { font-size: 21px; font-weight: bold; line-height: 1.9; }
  .question b { color: #d9480f; font-size: 1.12em; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choices.hidden { display: none; }
  .choices button {
    background: #fff;
    color: #333;
    border: 3px solid #ffd8a8;
    box-shadow: 0 4px 0 #e0c9a6;
    font-size: 19px;
    line-height: 1.6;
    padding: 4px 6px;
    min-height: 54px;
  }
  .choices button .num { position: absolute; left: 8px; top: 4px; font-size: 12px; color: #bbb; }
  .choices.ox button { font-size: 40px; line-height: 1; min-height: 64px; }
  .choices.ox button:first-child { color: #e03131; }
  .choices.ox button:last-child { color: #1c7ed6; }
  .choices button.right { background: #d3f9d8; border-color: var(--ok); }
  .choices button.wrong { background: #ffe3e3; border-color: var(--ng); }
  .choices button:disabled { opacity: 1; }
  .choices.done button:not(.right):not(.wrong) { opacity: .45; }

  .feedback {
    min-height: 92px;
    flex: none;
    max-height: 40%;
    overflow: auto;
    font-size: 15px;
    line-height: 1.75;
    padding: 6px 12px;
    position: relative;
  }
  .fb-hint { color: #999; text-align: center; padding-top: 18px; }
  .fb-head { font-size: 22px; font-weight: bold; }
  .fb-head.ok { color: var(--ok); }
  .fb-head.ng { color: var(--ng); }
  .fb-head .ans { color: #333; font-size: 19px; margin-left: 6px; }
  .fb-text { color: #444; }
  .next-btn {
    float: right;
    margin: 4px 0 2px 8px;
    font-size: 16px;
    padding: 6px 14px;
    background: #4dabf7;
    overflow: hidden;
  }
  .next-btn .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.7); width: 0; }

  /* ちず */
  .map-box {
    position: relative;
    flex: 1 1 auto;
    min-height: 140px;
    background: var(--sea);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 0 0 3px #b5dcf5;
  }
  .map-box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .map .pref path {
    fill: var(--land);
    stroke: var(--border);
    stroke-width: 1;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    transition: fill .25s;
  }
  .map .pref.out path { fill: #e9ede4; stroke: #b9c4b0; }
  .map.pick .pref { cursor: pointer; }
  @media (hover: hover) {
    .map.pick .pref:hover path { fill: #fff3bf; }
  }
  .map .pref.glow path { animation: glow .9s ease-in-out infinite alternate; stroke: #e67700; stroke-width: 2; }
  @keyframes glow { from { fill: var(--glow); } to { fill: #fff3bf; } }
  .map .pref.ans path { fill: #b2f2bb; }
  .map .pref.ok path { fill: #51cf66; stroke: #2b8a3e; stroke-width: 2; animation: none; }
  .map .pref.ng path { fill: #ff8787; stroke: #c92a2a; stroke-width: 2; animation: none; }
  .map .pref.m0 path { fill: #ffffff; }
  .map .pref.m1 path { fill: #ffa8a8; }
  .map .pref.m2 path { fill: #ffe066; }
  .map .pref.m3 path { fill: #69db7c; }
  .map .pref.sel path { stroke: #d9480f; stroke-width: 3; }
  .map .inset-frame { fill: rgba(255,255,255,.25); stroke: #8fc1e3; stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
  .map .ring { fill: none; stroke: #f76707; stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .map .ring.pulse { transform-box: fill-box; transform-origin: center; animation: ring 1.2s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .map .cap { fill: #e03131; stroke: #fff; stroke-width: 2.5; vector-effect: non-scaling-stroke; pointer-events: none; }
  .map-back {
    position: absolute;
    left: 8px;
    top: 8px;
    font-size: 15px;
    padding: 6px 12px;
    background: #4dabf7;
    display: none;
    z-index: 2;
  }
  .map-back.show { display: block; }
  .map-tip {
    position: absolute;
    right: 8px;
    bottom: 8px;
    font-size: 13px;
    color: #1c7ed6;
    background: rgba(255,255,255,.85);
    border-radius: 10px;
    padding: 2px 8px;
    pointer-events: none;
    display: none;
  }
  .map-tip.show { display: block; }

  /* けっか がめん */
  .score {
    font-size: 64px;
    font-weight: bold;
    color: var(--main);
    margin: 0;
    line-height: 1.2;
  }
  .score small { font-size: 28px; }
  .praise { font-size: 24px; margin: 6px 0 2px; }
  .review { list-style: none; padding: 0; margin: 10px 0 0; text-align: left; }
  .review li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border-bottom: 2px dotted #eee;
    font-size: 16px;
    line-height: 1.8;
  }
  .review .ok { color: var(--ok); font-weight: bold; white-space: nowrap; }
  .review .ng { color: var(--ng); font-weight: bold; white-space: nowrap; }
  .finish-btns { display: grid; gap: 10px; margin-top: 4px; }
  .finish-btns .big-btn { margin-top: 10px; font-size: 22px; padding: 12px; }
  .home-btn { background: #9775fa; }
  .again-btn { background: #ff8787; }

  /* おぼえた ちず */
  .mem-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mem-head h1 { margin: 6px 0; font-size: 26px; }
  .back-btn { font-size: 16px; padding: 8px 14px; background: #9775fa; white-space: nowrap; }
  .mem-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .mem-layout .map-box { min-height: 300px; }
  .mem-count { font-size: 22px; font-weight: bold; text-align: center; }
  .mem-count b { font-size: 34px; color: var(--ok); }
  .mem-bar { height: 14px; border-radius: 7px; background: #e9ecef; overflow: hidden; display: flex; margin: 6px 0 10px; }
  .mem-bar span { display: block; height: 100%; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 15px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 22px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border); flex: none; }
  .mem-info { margin-top: 10px; font-size: 16px; line-height: 1.9; min-height: 120px; }
  .mem-info .pname { font-size: 24px; font-weight: bold; }
  .mem-info .muted { color: #999; }
  .mem-regions { margin-top: 8px; font-size: 14px; line-height: 1.9; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .mem-regions b { color: var(--ok); }

  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s ease-out; display: inline-block; }

  /* カレンダー */
  .calendar {
    margin-top: 24px;
    background: var(--card);
    border-radius: 24px;
    padding: 12px 12px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    --cell: 42px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 22px; font-weight: bold; }
  .cal-nav { width: 52px; height: 40px; padding: 0; font-size: 18px; border-radius: 14px; background: var(--main); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal-week { margin-bottom: 3px; }
  .cal-week span { font-size: 14px; font-weight: bold; color: #888; }
  .cal-week .sun, .cal-day.sun .cal-num { color: #e03131; }
  .cal-week .sat, .cal-day.sat .cal-num { color: #1c7ed6; }
  .cal-day {
    position: relative;
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .cal-day.future .cal-num { opacity: .4; }
  .cal-day.today { background: #ffe8cc; box-shadow: inset 0 0 0 3px var(--main); }
  .cal-day.today .cal-num { color: #d9480f; font-size: 20px; }
  .cal-day.picked { box-shadow: inset 0 0 0 2px #adb5bd; }
  .cal-day.today.picked { box-shadow: inset 0 0 0 3px var(--main); }
  .cal-num { position: relative; z-index: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
  .cal-mark { position: absolute; inset: 1px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .cal-mark svg { height: 100%; width: 100%; }
  .cal-info { margin-top: 8px; min-height: 1.4em; font-size: 18px; font-weight: bold; text-align: center; color: #d9480f; }
  .cal-legend { margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 14px; color: #777; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend svg { width: 22px; height: 22px; }

  /* スマホ：もんだい がめん は 1がめん に おさめる */
  @media (max-width: 859px) {
    body.on-quiz .wrap { height: 100vh; height: 100dvh; padding: 8px 10px; }
    .mem-layout .map-box { flex: none; height: 56vh; }
    .mem-head h1 { font-size: 22px; }
  }
  @media (max-width: 380px) {
    .question { font-size: 19px; }
    .choices button { font-size: 17px; }
  }

  /* パソコン など ひろい がめん */
  @media (min-width: 600px) {
    .wrap { max-width: 680px; padding: 8px 16px; }
    #genreChoices { grid-template-columns: repeat(3, 1fr); }
    #areaChoices { grid-template-columns: repeat(4, 1fr); }
  }

  @media (min-width: 860px) {
    body.on-start .wrap { max-width: 1080px; }
    body.on-quiz .wrap, body.on-memory .wrap { max-width: 1240px; height: 100vh; height: 100dvh; }
    body.on-finish .wrap { max-width: 760px; }
    .start-layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; align-items: start; }
    .calendar { margin-top: 10px; --cell: 40px; }

    .quiz-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr); gap: 16px; }
    .quiz-layout .map-box { order: 0; }
    .panel { order: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .map-box { height: 100%; }
    .qcard { padding: 14px 16px; }
    .question { font-size: 24px; }
    .choices { grid-template-columns: 1fr; gap: 12px; }
    .choices button { font-size: 21px; min-height: 60px; }
    .choices.ox { grid-template-columns: 1fr 1fr; }
    .choices.ox button { font-size: 52px; min-height: 96px; }
    .feedback { flex: 1; min-height: 0; max-height: none; font-size: 17px; line-height: 1.8; padding: 12px 16px; }
    .fb-hint { padding-top: 30px; }
    .fb-head { font-size: 26px; }

    #finish .card { padding: 14px 20px; }
    .review { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
    .finish-btns { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 14px; }

    .mem-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 16px; }
    .mem-layout .map-box { height: 100%; min-height: 0; }
    .mem-panel { overflow: auto; }
  }
  @media (min-width: 860px) and (min-height: 700px) {
    h1 { margin: 12px 0 16px; }
    h2 { margin: 20px 0 10px; }
    .choice { padding: 12px 4px; }
    .big-btn { margin-top: 26px; padding: 16px; }
    .calendar { margin-top: 16px; padding: 14px 16px 12px; --cell: 46px; }
  }
  @media (min-width: 860px) and (min-height: 800px) {
    .wrap { padding: 16px; }
    .choice { padding: 16px 4px; }
    .choice .mark { font-size: 32px; }
    .calendar { margin-top: 22px; --cell: 52px; }
    .cal-day { font-size: 20px; }
    .question { font-size: 26px; }
    .choices button { min-height: 68px; }
  }
  @media (min-width: 860px) and (min-height: 900px) {
    .wrap { padding: 24px 16px; }
    h2 { margin: 26px 0 12px; }
    .big-btn { margin-top: 34px; padding: 18px; }
    .calendar { margin-top: 30px; padding: 18px 18px 14px; --cell: 58px; }
    .cal-grid { gap: 4px; }
  }
</style>
</head>
<body class="on-start">
<div class="wrap">

  <!-- はじめ がめん -->
  <section id="start" class="screen active">
    <h1>🗾 にっぽん ちり クイズ</h1>

    <div class="start-layout">
    <div class="start-main">
    <h2 class="rb">① ジャンル を えらぼう</h2>
    <div class="grid grid-2" id="genreChoices"></div>

    <h2 class="rb">② ちほう を えらぼう</h2>
    <div class="grid grid-2" id="areaChoices"></div>

    <button class="big-btn" id="startBtn">スタート！</button>
    <div class="sub-btns">
      <button class="sub-btn review" id="reviewBtn"></button>
      <button class="sub-btn" id="memoryBtn">🗾 おぼえた ちず</button>
    </div>
    </div>

    <!-- カレンダー -->
    <div>
    <div class="calendar">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="まえ の つき">◀</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="calNext" aria-label="つぎ の つき">▶</button>
      </div>
      <div class="cal-grid cal-week">
        <span class="sun">にち</span><span>げつ</span><span>か</span><span>すい</span><span>もく</span><span>きん</span><span class="sat">ど</span>
      </div>
      <div class="cal-grid" id="calDays"></div>
      <div class="cal-info" id="calInfo"></div>
      <div class="cal-legend" id="calLegend"></div>
    </div>
    <div class="credit">ちず：「地球地図日本」（国土地理院）を加工して作成</div>
    </div>
    </div>
  </section>

  <!-- もんだい がめん -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <span id="qNum">1もんめ / 10</span>
      <span id="scoreNow">⭕ 0</span>
      <button class="quit" id="quitBtn">やめる</button>
    </div>
    <div class="progress"><div id="bar"></div></div>

    <div class="quiz-layout">
      <div class="map-box" id="quizMap"></div>
      <div class="panel">
        <div class="card qcard">
          <span class="qtag" id="qTag"></span>
          <div class="question" id="question"></div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="card feedback" id="feedback"></div>
      </div>
    </div>
  </section>

  <!-- けっか がめん -->
  <section id="finish" class="screen">
    <h1>🎉 おつかれさま！</h1>
    <div class="card" style="text-align:center">
      <div class="praise" id="praise"></div>
      <div class="score" id="score"></div>
      <ul class="review" id="review"></ul>
    </div>
    <div class="finish-btns">
      <button class="big-btn" id="retryBtn">もういちど</button>
      <button class="big-btn again-btn rb" id="againBtn"></button>
      <button class="big-btn home-btn" id="homeBtn">さいしょに もどる</button>
    </div>
  </section>

  <!-- おぼえた ちず -->
  <section id="memory" class="screen">
    <div class="mem-head">
      <button class="back-btn" id="memBack">◀ もどる</button>
      <h1>🗾 おぼえた ちず</h1>
      <span style="width:40px"></span>
    </div>
    <div class="mem-layout">
      <div class="map-box" id="memMap"></div>
      <div class="card mem-panel">
        <div class="mem-count" id="memCount"></div>
        <div class="mem-bar" id="memBar"></div>
        <div class="legend rb">
          <span><i style="background:#69db7c"></i>おぼえた！</span>
          <span><i style="background:#ffe066"></i>もうすこし</span>
          <span><i style="background:#ffa8a8"></i>にがて</span>
          <span><i style="background:#fff"></i>まだ {出|で}ていない</span>
        </div>
        <div class="mem-regions" id="memRegions"></div>
        <div class="mem-info" id="memInfo"></div>
      </div>
    </div>
  </section>

</div>

  // パス の かず から おおきさ（わく）を けいさん する。core は いちばん おおきい しま だけ の わく
  function pathBox(d, core) {
    if (!d) return null;
    let best = null;
    const all = d.split("M").filter(Boolean).map((seg) => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const n = seg.match(/-?(?:\d+\.?\d*|\.\d+)/g).map(Number);
      let x = n[0], y = n[1];
      for (let i = 0; ; i += 2) {
        if (i > 0) { x += n[i]; y += n[i + 1]; }
        x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
        if (i + 3 >= n.length) break;
      }
      const b = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
      if (!best || b.w * b.h > best.w * best.h) best = b;
      return b;
    });
    return core ? best : union(all);

    boxes = boxes.filter(Boolean);

    const x1 = Math.max(...boxes.map((b) => b.x + b.w)), y1 = Math.max(...boxes.map((b) => b.y + b.h));
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };

  };
  const BOX = {};
  ALL_PREFS.forEach((id) => {
    const [m, i] = PREF_PATHS[id];
    BOX[id] = { main: pathBox(m), ins: pathBox(i), core: pathBox(m || i, true) };
  });

  const viewPart = (id) => id === 13 ? BOX[id].core : BOX[id].main;

    if (aid === "all") return FULL_BOX;
    const ids = areaPrefs(aid);
    const boxes = ids.filter((id) => id !== 47).map(viewPart);
    if (ids.includes(47)) boxes.push(INSET_BOX);
    return pad(union(boxes), 0.06);

      const [m, i] = PREF_PATHS[id];

    });

      anim = requestAnimationFrame(step);
    }
    setVB(FULL_BOX);

    // ちず の 1マス が がめん で なん px か
    const pxPerUnit = () => {
      const r = svg.getBoundingClientRect();
      return r.width && r.height ? Math.min(r.width / cur.w, r.height / cur.h) : 0;
    };
    const isSmall = (id) => {
      const b = BOX[id].core, s = pxPerUnit();
      return Math.max(b.w, b.h) * s < 50 || Math.min(b.w, b.h) * s < 24;
    };

    api.setView = (aid) => {
      const target = viewBoxOf(aid);
      zoomed = false;
      back.classList.remove("show");
      ALL_PREFS.forEach((id) => groups[id].classList.toggle("out", aid !== "all" && !areaOf(aid).regions.includes(pReg(id))));
      if (baseId === aid && cur === base) return;
      const animate = baseId === aid;
      base = target; baseId = aid;
      if (animate) animateTo(base); else { cancelAnimationFrame(anim); setVB(base); }
    };
    api.zoomOut = () => {
      if (!zoomed) return;
      zoomed = false;
      back.classList.remove("show");
      animateTo(base);
    };
    api.isZoomed = () => zoomed;
    api.setPickable = (on) => svg.classList.toggle("pick", on);
    api.setTip = (text) => { tip.innerHTML = text ? R(text) : ""; tip.classList.toggle("show", !!text); };
    // いろ を つける：{ 都道府県id: "class class" }
    api.paint = (map) => {
      ALL_PREFS.forEach((id) => {
        const g = groups[id];
        g.classList.remove("glow", "ok", "ng", "ans", "m0", "m1", "m2", "m3", "sel");
        if (map[id]) map[id].split(" ").forEach((c) => g.classList.add(c));
      });
      // いろ が ついた もの を うえ に かさねて、ふち が かくれない ように する
      const layer = svg.querySelector(".prefs");
      ALL_PREFS.filter((id) => map[id]).forEach((id) => layer.appendChild(groups[id]));
    };
    api.clearMarks = () => { marks.innerHTML = ""; };
    // ちいさい 都道府県 を 光らせる とき は まわり に わ を だす
    api.ring = (id) => {
      requestAnimationFrame(() => {
        if (!isSmall(id) && !(id === 47 && baseId === "all")) return;
        const [x, y] = LABEL_XY[id];
        const r = Math.max(cur.w, cur.h) * 0.04;
        marks.insertAdjacentHTML("beforeend",
          `<circle class="ring" cx="${x}" cy="${y}" r="${r}"/><circle class="ring pulse" cx="${x}" cy="${y}" r="${r}"/>`);
      });
    };
    api.capital = (id) => {
      const [x, y] = CAPITAL_XY[id];
      const r = Math.max(cur.w, cur.h) * 0.011;
      marks.insertAdjacentHTML("beforeend", `<circle class="cap" cx="${x}" cy="${y}" r="${r}"/>`);
    };

    // タップ した ところ の 都道府県 を さがす（すこし はずれて も ちかく の もの を えらぶ）
    function hit(x, y) {
      const el = document.elementFromPoint(x, y);
      const g = el && el.closest ? el.closest(".pref") : null;
      return g && svg.contains(g) ? Number(g.dataset.id) : null;
    }
    function findPref(x, y) {
      let id = hit(x, y);
      if (id) return id;
      for (const r of [7, 14, 21]) {
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2;
          id = hit(x + Math.cos(a) * r, y + Math.sin(a) * r);
          if (id) return id;
        }
      }
      return null;
    }
    svg.addEventListener("click", (e) => {
      if (!api.onPick) return;
      const id = findPref(e.clientX, e.clientY);
      if (!id) return;
      if (api.smartZoom && !zoomed && baseId === "all" && id !== 1 && id !== 47 && isSmall(id)) {
        zoomed = true;
        back.classList.add("show");
        animateTo(regionBox(pReg(id)));
        return;
      }
      api.onPick(id);
    });
    back.addEventListener("click", api.zoomOut);
    return api;
  }

  // ================= もんだい を つくる =================
  // おなじ ちほう → えらんだ はんい → ぜんこく の じゅん に まぎらわしい 都道府県 を えらぶ
  function pickPrefs(n, exclude, aid, near) {
    const ex = new Set(exclude), out = [];
    const tiers = [
      near ? regionPrefs(pReg(near)).filter((id) => areaPrefs(aid).includes(id)) : [],
      areaPrefs(aid),
      ALL_PREFS,
    ];
    for (const tier of tiers) {
      for (const id of shuffle(tier)) {
        if (out.length >= n) return out;
        if (!ex.has(id) && !out.includes(id)) out.push(id);
      }
    }
    return out;
  }
  const famousOf = (id) => FAMOUS.find((f) => f.prefs[0] === id);
  const verbF = (f) => f.kind === "f" ? "が {有名|ゆうめい}だよ" : f.kind === "e" ? "が おこなわれるよ" : "が あるよ";
  const prefList = (ids) => ids.map(pName).join("・");

  function prefExplain(id) {
    const f = famousOf(id);
    return `${pName(id)}は ${rName(pReg(id))}に あるよ。${office(id)}は ${pCap(id)}。` + (f ? `${f.name}${verbF(f)}。` : "");
  }
  function capExplain(id) {
    return `${pName(id)}の ${office(id)}は ${pCap(id)}。` +
      (id === 13 ? "{都庁|とちょう}は {新宿区|しんじゅくく}に あるよ。"
        : capDiff(id) ? "{都道府県|とどうふけん}の {名前|なまえ}と ちがうので {気|き}を つけよう。" : "{都道府県|とどうふけん}と {同|おな}じ {名前|なまえ}だね。");
  }
  function regExplain(id) {
    const r = pReg(id), n = regionPrefs(r).length;
    return `${pName(id)}は ${rName(r)}の {都道府県|とどうふけん}。` + (n > 1 ? `${rName(r)}には ${n}つの {都道府県|とどうふけん}が あるよ。` : "");
  }
  const natVerb = (f) => f.kind === "川" ? "{流|なが}れている" : "ある";
  const famQ = (f) => f.kind === "f" ? `<b>${f.name}</b>で {有名|ゆうめい}な` : f.kind === "e" ? `<b>${f.name}</b>が おこなわれる` : `<b>${f.name}</b>が ある`;
  const OX = (truth) => [{ html: "⭕", ok: truth }, { html: "❌", ok: !truth }];
  const prefChoices = (ids, ok) => shuffle(ids).map((id) => ({ html: pName(id), ok: ok(id), pref: id }));

  // spec = { g: ジャンル, f: かたち, s: なに の もんだい か, v: ちず の はんい }
  function build(spec) {
    const { g, f, s, v } = spec;
    const q = { spec, view: v, glow: null, kind: "choice", choices: [], accept: [], mark: [], capital: null, pref: null, smartZoom: false };
    const P = typeof s === "number" ? s : null;
    switch (f) {
      // ---- 都道府県 ----
      case "pn4":
        Object.assign(q, { text: "{光|ひか}っている {都道府県|とどうふけん}は どこ？", glow: P, mark: [P], pref: P,
          choices: prefChoices([P, ...pickPrefs(3, [P], v, P)], (id) => id === P),
          answer: pName(P), explain: prefExplain(P), short: `${pName(P)}の ばしょ` });
        break;
      case "ptap":
        Object.assign(q, { kind: "tap", text: `<b>${pName(P)}</b>は どこ？ {地図|ちず}を タップしよう`, accept: [P], mark: [P], pref: P, smartZoom: true,
          answer: pName(P), explain: prefExplain(P), short: `${pName(P)}の ばしょ` });
        break;
      case "pox": {
        const truth = Math.random() < 0.5, X = truth ? P : pickPrefs(1, [P], v, P)[0];
        Object.assign(q, { text: `{光|ひか}っているのは <b>${pName(X)}</b>。○か ×か？`, glow: P, mark: [P], pref: P, choices: OX(truth), ox: true,
          answer: truth ? "⭕" : `❌（${pName(P)}）`, explain: prefExplain(P), short: `${pName(P)}の ばしょ` });
        break;
      }
      // ---- 県庁所在地 ----
      case "c4":
        Object.assign(q, { text: `${pName(P)}の ${office(P)}は？`, glow: P, mark: [P], pref: P, capital: P,
          choices: shuffle([P, ...pickPrefs(3, [P], v, P)]).map((id) => ({ html: pCap(id), ok: id === P })),
          answer: pCap(P), explain: capExplain(P), short: `${pName(P)} → ${pCap(P)}` });
        break;
      case "cr4":
        Object.assign(q, { text: `{県庁所在地|けんちょうしょざいち}が <b>${pCap(P)}</b>の {都道府県|とどうふけん}は？`, mark: [P], pref: P, capital: P,
          choices: prefChoices([P, ...pickPrefs(3, [P], v, P)], (id) => id === P),
          answer: pName(P), explain: capExplain(P), short: `${pCap(P)} → ${pName(P)}` });
        break;
      case "ctap":
        Object.assign(q, { kind: "tap", text: `{県庁所在地|けんちょうしょざいち}が <b>${pCap(P)}</b>の {都道府県|とどうふけん}を タップしよう`,
          accept: [P], mark: [P], pref: P, capital: P, smartZoom: true,
          answer: pName(P), explain: capExplain(P), short: `${pCap(P)} → ${pName(P)}` });
        break;
      case "cox": {
        const truth = Math.random() < 0.5, X = truth ? P : pickPrefs(1, [P], v, P)[0];
        Object.assign(q, { text: `${pName(P)}の ${office(P)}は <b>${pCap(X)}</b>。○か ×か？`, glow: P, mark: [P], pref: P, capital: P,
          choices: OX(truth), ox: true, answer: truth ? "⭕" : `❌（${pCap(P)}）`, explain: capExplain(P), short: `${pName(P)} → ${pCap(P)}` });
        break;
      }
      // ---- 地方区分 ----
      case "r4": {
        const r = pReg(P);
        const others = shuffle([0, 1, 2, 3, 4, 5, 6, 7].filter((x) => x !== r)).slice(0, 3);
        Object.assign(q, { text: "{光|ひか}っている {都道府県|とどうふけん}は {何地方|なにちほう}？", glow: P, mark: [P], pref: P,
          choices: shuffle([r, ...others]).map((x) => ({ html: rName(x), ok: x === r })),
          answer: rName(r), explain: regExplain(P), short: `${pName(P)} → ${rName(r)}` });
        break;
      }
      case "rox": {
        const r = pReg(P), truth = Math.random() < 0.5;
        const R2 = truth ? r : sample([r - 1, r + 1].filter((x) => x >= 0 && x <= 7));
        Object.assign(q, { text: `${pName(P)}は <b>${rName(R2)}</b>に ある。○か ×か？`, glow: P, mark: [P], pref: P, choices: OX(truth), ox: true,
          answer: truth ? "⭕" : `❌（${rName(r)}）`, explain: regExplain(P), short: `${pName(P)} → ${rName(r)}` });
        break;
      }
      case "rtap": {
        const r = Number(s.slice(1)), ids = regionPrefs(r);
        Object.assign(q, { kind: "tap", text: `<b>${rName(r)}</b>に ある {都道府県|とどうふけん}を 1つ タップしよう`, accept: ids, mark: ids,
          answer: rName(r), explain: `${rName(r)}は ${prefList(ids)}。`, short: `${rName(r)}の {都道府県|とどうふけん}` });
        break;
      }
      case "rn4": {
        const r = Number(s.slice(1)), ids = regionPrefs(r);
        const near = ALL_PREFS.filter((id) => Math.abs(pReg(id) - r) === 1);
        const odd = sample(near.filter((id) => areaPrefs(v).includes(id)).length ? near.filter((id) => areaPrefs(v).includes(id)) : near);
        Object.assign(q, { text: `<b>${rName(r)}</b>では ない {都道府県|とどうふけん}は どれ？`, mark: [odd], pref: odd,
          choices: prefChoices([odd, ...shuffle(ids).slice(0, 3)], (id) => id === odd),
          answer: pName(odd), explain: `${pName(odd)}は ${rName(pReg(odd))}だよ。`, short: `${rName(r)}では ない {県|けん}` });
        break;
      }
      // ---- 山・川・平野・湖 / 名所・名物 ----
      default: {
        const nat = g === "nat";
        const F = (nat ? NATURE : FAMOUS)[s];
        const where = `（${prefList(F.prefs)}）`;
        const one = F.prefs.length === 1 ? F.prefs[0] : null;
        Object.assign(q, { mark: F.prefs, pref: one, explain: F.note + where, short: F.name });
        const qWhat = nat ? `<b>${F.name}</b>が ${natVerb(F)}` : famQ(F);
        if (f === "fd4") {
          const others = shuffle(NATURE.filter((o) => o !== F && o.kind === F.kind)).slice(0, 3);
          Object.assign(q, { text: `${F.desc}は どれ？`, answer: F.name,
            choices: shuffle([F, ...others]).map((o) => ({ html: o.name, ok: o === F })) });
        } else if (f === "fp4") {
          const others = shuffle(FAMOUS.filter((o) => !o.prefs.includes(one) && !o.x.includes(one))).slice(0, 3);
          Object.assign(q, { text: `${pName(one)}で {有名|ゆうめい}な ものは どれ？`, glow: one, answer: F.name, short: `${pName(one)}の ${F.name}`,
            choices: shuffle([F, ...others]).map((o) => ({ html: o.name, ok: o === F })) });
        } else if (f === "fq4") {
          const right = sample(F.prefs);
          Object.assign(q, { text: `${qWhat} {都道府県|とどうふけん}は？`, answer: pName(right),
            choices: prefChoices([right, ...pickPrefs(3, [...F.prefs, ...F.x], v, right)], (id) => F.prefs.includes(id)) });
        } else if (f === "ftap") {
          Object.assign(q, { kind: "tap", text: `${qWhat} {都道府県|とどうふけん}を タップしよう`, accept: F.prefs, smartZoom: true, answer: prefList(F.prefs) });
        } else {
          const truth = Math.random() < 0.5;
          const X = truth ? sample(F.prefs) : pickPrefs(1, [...F.prefs, ...F.x], v, F.prefs[0])[0];
          const stmt = nat ? `<b>${F.name}</b>は ${pName(X)}${F.kind === "川" ? "を {流|なが}れている" : "に ある"}`
            : F.kind === "f" ? `<b>${F.name}</b>は ${pName(X)}の {名物|めいぶつ}`
            : F.kind === "e" ? `<b>${F.name}</b>は ${pName(X)}で おこなわれる` : `<b>${F.name}</b>は ${pName(X)}に ある`;
          Object.assign(q, { text: `${stmt}。○か ×か？`, choices: OX(truth), ox: true, answer: truth ? "⭕" : `❌` });
        }
      }
    }
    q.tag = genreOf(g).label;
    return q;
  }

  // ジャンル ごと の「なに を きく か」と「きき かた」
  function subjects(g, aid) {
    const prefs = areaPrefs(aid);
    const list = [];
    const add = (s, forms, v = aid) => list.push({ g, s, forms, v });
    if (g === "pref") prefs.forEach((id) => add(id, ["pn4", "pn4", "ptap", "ptap", "pox"]));
    if (g === "cap") prefs.forEach((id) => {
      add(id, ["c4", "c4", "cr4", "ctap", "cox"]);
      if (capDiff(id)) add(id, ["c4", "cr4", "ctap"]); // まちがえやすい ものは おおめ に
    });
    if (g === "reg") {
      prefs.forEach((id) => add(id, ["r4", "r4", "rox"]));
      areaOf(aid).regions.forEach((r) => {
        add("R" + r, ["rtap"], "all");
        if (regionPrefs(r).length >= 3) add("R" + r, ["rn4"]);
      });
    }
    const inArea = (F) => F.prefs.some((id) => prefs.includes(id));
    if (g === "nat") NATURE.forEach((F, i) => { if (inArea(F)) add(i, F.desc ? ["fd4", "fd4", "fq4", "ftap", "fox"] : ["fq4", "fq4", "ftap", "fox"]); });
    if (g === "fam") FAMOUS.forEach((F, i) => { if (inArea(F)) add(i, F.prefs.length === 1 ? ["fq4", "fq4", "ftap", "fox", "fp4"] : ["fq4", "fq4", "ftap", "fox"]); });
    return list;
  }

  function makeQuestions(genre, aid) {
    let pool = genre === "mix"
      ? ["pref", "cap", "reg", "nat", "fam"].flatMap((g) => shuffle(subjects(g, aid)).slice(0, 6))
      : subjects(genre, aid);
    const used = new Set(), specs = [];
    // なるべく ちがう もの を、たりない とき は きき かた を かえて くりかえす
    for (let round = 0; specs.length < TOTAL && round < 6; round++) {
      for (const sub of shuffle(pool)) {
        if (specs.length >= TOTAL) break;
        const forms = shuffle(sub.forms).filter((f) => !used.has(`${sub.g}:${f}:${sub.s}`));
        if (!forms.length) continue;
        if (round === 0 && specs.some((x) => x.s === sub.s && x.g === sub.g)) continue;
        const f = forms[0];
        used.add(`${sub.g}:${f}:${sub.s}`);
        specs.push({ g: sub.g, f, s: sub.s, v: sub.v });
      }
    }
    return shuffle(specs).map(build);
  }

  // ================= きろく（ブラウザ に ほぞん して、とじても きえない）=================
  const RECORD_KEY = "chiri-quiz-records";
  const WRONG_KEY = "chiri-quiz-wrong";
  const MASTERY_KEY = "chiri-quiz-mastery";
  const MARU_COUNT = 10;     // この かず いじょう で ○
  const HANAMARU_COUNT = 20; // この かず いじょう で はなまる

  function load(key, fallback) {
    try {
      const data = JSON.parse(localStorage.getItem(key));
      return data && typeof data === "object" ? data : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function save(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* ほぞん できなくても つづける */ }
  }
  const loadRecords = () => { const d = load(RECORD_KEY, {}); return Array.isArray(d) ? {} : d; };
  let records = loadRecords();

  const pad2 = (n) => String(n).padStart(2, "0");
  const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const countOf = (key) => Number(records[key]) || 0;

  // こたえる たび に、その日 の かず を 1 ふやす
  function addRecord() {
    records = loadRecords(); // べつ の タブ で ふえた ぶん も いかす
    const key = dateKey(new Date());
    records[key] = countOf(key) + 1;
    save(RECORD_KEY, records);
  }

  // まちがえた もんだい
  const specKey = (s) => `${s.g}:${s.f}:${s.s}:${s.v}`;
  const loadWrong = () => { const d = load(WRONG_KEY, []); return Array.isArray(d) ? d : []; };
  function updateWrong(spec, correct) {
    const list = loadWrong().filter((s) => specKey(s) !== specKey(spec));
    if (!correct) list.push(spec);
    save(WRONG_KEY, list);
  }

  // 都道府県 ごと の おぼえぐあい { id: { c: せいかい, w: まちがい, s: れんぞく せいかい } }
  function updateMastery(id, correct) {
    if (!id) return;
    const m = load(MASTERY_KEY, {});
    const st = m[id] || { c: 0, w: 0, s: 0 };
    if (correct) { st.c++; st.s++; } else { st.w++; st.s = 0; }
    m[id] = st;
    save(MASTERY_KEY, m);
  }
  const levelOf = (st) => !st ? 0 : st.s >= LEARNED_STREAK ? 3 : st.s >= 1 ? 2 : 1;

  // ================= カレンダー =================
  const MARU_SVG =
    '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="41" fill="none" stroke="#f03e3e" stroke-width="7"/></svg>';
  const HANAMARU_SVG = (() => {
    // まわり の はなびら
    const N = 10, Rr = 38, r = 12;
    const pt = (i) => {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      return `${(50 + Rr * Math.cos(a)).toFixed(1)} ${(50 + Rr * Math.sin(a)).toFixed(1)}`;
    };
    let petals = `M${pt(0)}`;
    for (let i = 1; i <= N; i++) petals += ` A${r} ${r} 0 0 1 ${pt(i)}`;
    // なか の ぐるぐる（まんなか の すうじ に かからない ように そと がわ だけ）
    let spiral = "";
    for (let i = 0; i <= 80; i++) {
      const t = i / 80;
      const a = -Math.PI / 2 + t * Math.PI * 2 * 1.75;
      const rr = 31 - t * 9;
      spiral += `${i ? " L" : "M"}${(50 + rr * Math.cos(a)).toFixed(1)} ${(50 + rr * Math.sin(a)).toFixed(1)}`;
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#f03e3e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' +
      `<path d="${petals}" fill="#fff0f6"/><path d="${spiral}" fill="none"/></g></svg>`;
  })();
  const markOf = (n) => n >= HANAMARU_COUNT ? HANAMARU_SVG : n >= MARU_COUNT ? MARU_SVG : "";

  let calYear, calMonth, calPicked = null;

  function resetCalendar() {
    records = loadRecords();
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calPicked = null;
    renderCalendar();
  }

  function renderCalendar() {
    const todayKey = dateKey(new Date());
    $("calTitle").textContent = `${calYear}ねん ${calMonth + 1}がつ`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < first; i++) html += "<div></div>";
    for (let d = 1; d <= days; d++) {
      const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
      const wd = (first + d - 1) % 7;
      const cls = ["cal-day",
        wd === 0 ? "sun" : wd === 6 ? "sat" : "",
        key === todayKey ? "today" : "",
        key > todayKey ? "future" : "",
        key === calPicked ? "picked" : ""].join(" ");
      html += `<div class="${cls}" data-date="${key}">` +
        `<span class="cal-mark">${markOf(countOf(key))}</span><span class="cal-num">${d}</span></div>`;
    }
    $("calDays").innerHTML = html;
    renderCalInfo();
  }

  function renderCalInfo() {
    const todayKey = dateKey(new Date());
    const key = calPicked || todayKey;
    const n = countOf(key);
    let text;
    if (key === todayKey) {
      text = n >= HANAMARU_COUNT ? `きょう は ${n}もん！ はなまる 🎉`
           : n >= MARU_COUNT ? `きょう は ${n}もん！ あと ${HANAMARU_COUNT - n}もん で はなまる`
           : `きょう は ${n}もん。あと ${MARU_COUNT - n}もん で ○`;
    } else {
      const [, m, d] = key.split("-").map(Number);
      text = key > todayKey ? `${m}がつ ${d}にち は まだ だよ`
           : `${m}がつ ${d}にち は ${n}もん` + (n >= HANAMARU_COUNT ? " はなまる" : n >= MARU_COUNT ? " ○" : "");
    }
    $("calInfo").textContent = text;
  }

  $("calLegend").innerHTML =
    `<span>${MARU_SVG} ${MARU_COUNT}もん いじょう</span><span>${HANAMARU_SVG} ${HANAMARU_COUNT}もん いじょう</span>`;
  $("calPrev").addEventListener("click", () => {
    if (--calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  $("calNext").addEventListener("click", () => {
    if (++calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  $("calDays").addEventListener("click", (e) => {
    const day = e.target.closest(".cal-day");
    if (!day) return;
    calPicked = calPicked === day.dataset.date ? null : day.dataset.date;
    renderCalendar();
  });

  // ================= はじめ がめん =================
  let genre = "pref";
  let area = "all";
  $("genreChoices").innerHTML = GENRES.map((g, i) =>
    `<button class="choice${i === 0 ? " selected" : ""}" data-v="${g.id}"><span class="mark">${g.icon}</span>${R(g.label)}</button>`).join("");
  $("areaChoices").innerHTML = AREAS.map((a, i) =>
    `<button class="choice${i === 0 ? " selected" : ""}" data-v="${a.id}">${R(a.label)}</button>`).join("");
  function setupChoices(containerId, onPick) {
    const buttons = $(containerId).querySelectorAll(".choice");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        onPick(btn.dataset.v);
      });
    });
  }
  setupChoices("genreChoices", (v) => { genre = v; });
  setupChoices("areaChoices", (v) => { area = v; });
  document.querySelectorAll(".rb").forEach((el) => { el.innerHTML = R(el.innerHTML); });

  function renderStart() {
    resetCalendar();
    const n = loadWrong().length;
    $("reviewBtn").innerHTML = R(`📕 ふくしゅう<br><small>まちがえた もんだい ${n}もん</small>`);
    $("reviewBtn").disabled = n === 0;
  }

  // ---- がめん きりかえ ----
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    document.body.className = "on-" + id;
    if (id === "start") renderStart();
    window.scrollTo(0, 0);
  }

  // ================= こうかおん（おんせい ファイル は つかわず ブラウザ で つくる）=================
  let audioCtx = null;
  // スマホ は さいしょ に がめん を さわった とき で ないと おと が でない ので、そこで じゅんび する
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state !== "running") {
        // iPhone で たしか に おと が でる ように、むおん を いっしゅん ならして から さいかい する
        const src = audioCtx.createBufferSource();
        src.buffer = audioCtx.createBuffer(1, 1, 22050);
        src.connect(audioCtx.destination);
        src.start(0);
        audioCtx.resume();
      }
    } catch (e) { /* おと が だせなくても つづける */ }
  }
  // iPhone は ゆび を はなした とき か タップ した とき で ないと おと の じゅんび が できない ので、そこ で じゅんび する（タッチ した しゅんかん では だめ）
  ["touchend", "click", "keydown"].forEach((type) => document.addEventListener(type, unlockAudio, true));

  // がめん を けしたり ほか の アプリ に いったり して とまって いたら、ならす まえ に さいかい する
  function readyAudio() {
    if (audioCtx && audioCtx.state !== "running") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function tone(freq, start, dur, type = "sine", vol = 0.35) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  }
  // せいかい の「ピンポン」（たかい おと → ひくい おと）
  function playPinpon() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    tone(1319, t, 0.35);        // ピン（ミ）
    tone(1047, t + 0.18, 0.6);  // ポン（ド）
  }
  // まちがい の「ブブー」（ひくい ブザー の おと）
  function playBubu() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    tone(150, t, 0.16, "square", 0.12);        // ブ
    tone(150, t + 0.22, 0.6, "square", 0.12);  // ブー
  }

  // ================= クイズ =================
  const quizMap = createMap($("quizMap"));
  let questions = [];
  let index = 0;
  let answered = false;
  let autoNextId = null;
  let lastSettings = null; // もういちど の ため

  function startGame(list) {
    if (!list.length) { show("start"); return; }
    questions = list;
    index = 0;
    show("quiz");
    showQuestion();
  }
  const startNormal = () => { lastSettings = { genre, area }; startGame(makeQuestions(genre, area)); };
  const retry = () => {
    if (lastSettings) startGame(makeQuestions(lastSettings.genre, lastSettings.area));
    else startGame(shuffle(loadWrong()).slice(0, TOTAL).map(build));
  };
  function startReview(specs) {
    lastSettings = null;
    startGame(shuffle(specs).slice(0, TOTAL).map(build));
  }

  function showQuestion() {
    const q = questions[index];
    answered = false;
    clearTimeout(autoNextId);
    $("qNum").textContent = `${index + 1}もんめ / ${questions.length}`;
    $("scoreNow").textContent = `⭕ ${questions.filter((x) => x.correct).length}`;
    $("bar").style.width = `${(index / questions.length) * 100}%`;
    $("qTag").innerHTML = R(q.tag);
    $("question").innerHTML = R(q.text);

    quizMap.setView(q.view);
    quizMap.clearMarks();
    quizMap.paint(q.glow ? { [q.glow]: "glow" } : {});
    if (q.glow) quizMap.ring(q.glow);
    quizMap.smartZoom = q.smartZoom;
    quizMap.setPickable(q.kind === "tap");
    quizMap.onPick = q.kind === "tap" ? (id) => answer(id) : null;
    quizMap.setTip(q.kind === "tap" && q.smartZoom && q.view === "all" ? "ちいさい ところは タップで おおきく なるよ" : "");

    const box = $("choices");
    box.className = "choices" + (q.kind === "tap" ? " hidden" : "") + (q.ox ? " ox" : "");
    box.innerHTML = q.choices.map((c, i) =>
      `<button data-i="${i}">${q.ox ? "" : `<span class="num">${i + 1}</span>`}${R(c.html)}</button>`).join("");
    $("feedback").innerHTML = `<div class="fb-hint">${R(q.kind === "tap" ? "{地図|ちず}の {正|ただ}しい ところを タップしてね 👆" : "こたえを えらんでね")}</div>`;
  }

  function answer(pick) {
    if (answered) return;
    const q = questions[index];
    answered = true;
    let picked = null;
    if (q.kind === "tap") {
      picked = pick;
      q.correct = q.accept.includes(pick);
    } else {
      const c = q.choices[pick];
      q.correct = c.ok;
      picked = c.pref || null;
      $("choices").classList.add("done");
      $("choices").querySelectorAll("button").forEach((b, i) => {
        b.disabled = true;
        if (q.choices[i].ok) b.classList.add("right");
        else if (i === pick) b.classList.add("wrong");
      });
    }
    if (q.correct) playPinpon(); else playBubu();
    addRecord();
    updateMastery(q.pref, q.correct);
    updateWrong(q.spec, q.correct);

    // ちず に こたえ を いろ で だす
    quizMap.onPick = null;
    quizMap.setPickable(false);
    quizMap.setTip("");
    quizMap.clearMarks();
    const paint = {};
    q.mark.forEach((id) => { paint[id] = "ok"; });
    if (q.kind === "tap" && q.correct && q.mark.length > 1) {
      q.mark.forEach((id) => { paint[id] = "ans"; }); // ほか にも せいかい が ある とき は うすい みどり
      paint[picked] = "ok";
    }
    if (!q.correct && picked) paint[picked] = "ng";
    quizMap.paint(paint);
    if (!q.correct && quizMap.isZoomed()) quizMap.zoomOut();
    if (q.capital) setTimeout(() => quizMap.capital(q.capital), 50);

    const fb = $("feedback");
    const last = index + 1 >= questions.length;
    const head = q.correct
      ? `<div class="fb-head ok"><span class="pop">⭕</span> せいかい！</div>`
      : `<div class="fb-head ng"><span class="pop">❌</span> ざんねん…<span class="ans">こたえ：${R(q.answer)}</span></div>`;
    const wrongTap = q.kind === "tap" && !q.correct ? `そこは ${pName(picked)}。` : "";
    fb.innerHTML = head +
      `<button class="next-btn" id="nextBtn">${last ? "けっか へ" : "つぎへ"} ▶<span class="bar"></span></button>` +
      `<div class="fb-text">${R(wrongTap + q.explain)}</div>`;
    const wait = q.correct ? AUTO_NEXT_OK_MS : AUTO_NEXT_NG_MS;
    const bar = fb.querySelector(".bar");
    bar.style.transition = `width ${wait}ms linear`;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = "100%"; }));
    $("nextBtn").addEventListener("click", next);
    $("bar").style.width = `${((index + 1) / questions.length) * 100}%`;
    $("scoreNow").textContent = `⭕ ${questions.filter((x) => x.correct).length}`;
    autoNextId = setTimeout(next, wait);
  }

  function next() {
    clearTimeout(autoNextId);
    if (!answered) return;
    index++;
    if (index < questions.length) showQuestion();
    else finish();
  }

  function finish() {
    const total = questions.length;
    const score = questions.filter((q) => q.correct).length;
    $("score").innerHTML = `${score}<small> / ${total} もん</small>`;
    $("praise").textContent =
      score === total ? "💯 ぜんもん せいかい！すごい！" :
      score >= total * 0.8 ? "🌟 よく できました！" :
      score >= total * 0.5 ? "👍 がんばったね！" :
                             "💪 つぎ も がんばろう！";
    $("review").innerHTML = questions.map((q) => `
      <li>
        <span>${R(q.short)}</span>
        ${q.correct ? '<span class="ok">⭕</span>' : '<span class="ng">❌</span>'}
      </li>`).join("");
    const wrong = questions.filter((q) => !q.correct);
    $("againBtn").innerHTML = R(`まちがえた ${wrong.length}もん を もういちど`);
    $("againBtn").style.display = wrong.length ? "" : "none";
    $("againBtn").onclick = () => startReview(wrong.map((q) => q.spec));
    show("finish");
  }

  $("choices").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b && !answered) answer(Number(b.dataset.i));
  });
  $("startBtn").addEventListener("click", startNormal);
  $("retryBtn").addEventListener("click", retry);
  $("homeBtn").addEventListener("click", () => show("start"));
  $("reviewBtn").addEventListener("click", () => startReview(loadWrong()));
  $("quitBtn").addEventListener("click", () => {
    if (confirm("とちゅう で やめる？")) { clearTimeout(autoNextId); show("start"); }
  });
  // パソコン の キーボード でも つかえる（1〜4 で えらぶ、Enter で つぎへ）
  document.addEventListener("keydown", (e) => {
    if (!$("quiz").classList.contains("active")) return;
    const q = questions[index];
    if (!answered && q.kind === "choice" && /^[1-4]$/.test(e.key) && Number(e.key) <= q.choices.length) answer(Number(e.key) - 1);
    else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  });

  // ================= おぼえた ちず =================
  const memMap = createMap($("memMap"));
  memMap.smartZoom = true;
  memMap.setPickable(true);
  let memPicked = null;

  function renderMemory() {
    const m = load(MASTERY_KEY, {});
    const levels = ALL_PREFS.map((id) => levelOf(m[id]));
    const paint = {};
    ALL_PREFS.forEach((id, i) => { paint[id] = "m" + levels[i] + (id === memPicked ? " sel" : ""); });
    memMap.paint(paint);
    const cnt = [0, 0, 0, 0];
    levels.forEach((l) => cnt[l]++);
    $("memCount").innerHTML = `おぼえた <b>${cnt[3]}</b> / 47`;
    const colors = ["#e9ecef", "#ffa8a8", "#ffe066", "#69db7c"];
    $("memBar").innerHTML = [3, 2, 1].map((l) => `<span style="width:${(cnt[l] / 47) * 100}%;background:${colors[l]}"></span>`).join("");
    $("memRegions").innerHTML = REGIONS.map((_, r) => {
      const ids = regionPrefs(r);
      const done = ids.filter((id) => levelOf(m[id]) === 3).length;
      return `<span>${R(rName(r))} <b>${done}</b>/${ids.length}</span>`;
    }).join("");
    const st = memPicked && m[memPicked];
    $("memInfo").innerHTML = memPicked
      ? `<div class="pname">${R(pName(memPicked))}</div>` + R(
          `${rName(pReg(memPicked))}・${office(memPicked)}は ${pCap(memPicked)}<br>`) +
        (st ? `⭕ ${st.c}かい ／ ❌ ${st.w}かい ／ れんぞく ${st.s}かい` + (st.s >= LEARNED_STREAK ? " 🎉" : `<br><span class="muted">あと ${LEARNED_STREAK - st.s}かい れんぞく で せいかい すると「おぼえた！」</span>`)
            : `<span class="muted">${R("まだ もんだいに {出|で}ていないよ")}</span>`)
      : `<span class="muted">${R("{地図|ちず}の {都道府県|とどうふけん}を タップすると、くわしく {見|み}られるよ。<br>{同|おな}じ {都道府県|とどうふけん}の もんだいに 3かい れんぞくで せいかいすると「おぼえた！」に なるよ。")}</span>`;
  }
  memMap.onPick = (id) => { memPicked = memPicked === id ? null : id; renderMemory(); };
  $("memoryBtn").addEventListener("click", () => {
    memPicked = null;
    show("memory");
    memMap.setView("all");
    renderMemory();
  });
  $("memBack").addEventListener("click", () => show("start"));

  renderStart();
})();
</script>
</body>
</html>
